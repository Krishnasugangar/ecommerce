spring:
  datasource:
    url: jdbc:h2:mem:ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: test-secret-key-which-is-long-enough-for-hs256-signing
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  admin:
    email: admin@ecommerce.local
    password: Admin@12345
  seed:
    sample-data: false
